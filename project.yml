name: Folio
options:
  bundleIdPrefix: com.junki3lab
  deploymentTarget:
    iOS: "15.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
targets:
  Folio:
    type: application
    platform: iOS
    sources: [Sources]
    scheme: {}
    dependencies:
      - package: ZIPFoundation
      - framework: Python.xcframework
        embed: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Folio
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Lets Folio appear in "Open in…" / the share sheet for books and music
        # folio://download?url=… starts a download (handy from Shortcuts)
        CFBundleURLTypes:
          - CFBundleURLName: com.junki3lab.folio
            CFBundleURLSchemes: [folio]
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: EPUB
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.mp3, com.apple.m4a-audio, public.mpeg-4-audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junki3lab.folio
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Embedded Python (yt-dlp)
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Folio-Bridging-Header.h
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(PROJECT_DIR)"]
        HEADER_SEARCH_PATHS: ["$(inherited)", "\"$(BUILT_PRODUCTS_DIR)/Python.framework/Headers\""]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
        CLANG_ENABLE_OBJC_ARC: YES
    postBuildScripts:
      - name: Install Python and yt-dlp
        script: bash "$PROJECT_DIR/scripts/install_python.sh"
        basedOnDependencyAnalysis: false
